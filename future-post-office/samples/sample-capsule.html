<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未来邮局示例胶囊</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#10091f,#2b174f 55%,#090611);color:#f7f4ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.shell{width:min(820px,100%);padding:clamp(24px,6vw,56px);border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(12,8,25,.72);box-shadow:0 30px 90px rgba(0,0,0,.48)}
.eyebrow{color:#f3d9a5;font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(36px,8vw,68px);line-height:1.03;letter-spacing:-.06em}.count{color:#f7c873;font-size:clamp(42px,12vw,92px);font-weight:950;letter-spacing:-.08em}.letter{font-size:clamp(17px,3vw,21px);line-height:2;color:#eee9ff}.sig{text-align:right;color:#b9b1d3}
</style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">未来邮局 · 示例</p>
    <h1>写给一年后的你</h1>
    <p>开启日期：2027年9月27日</p>
    <div class="count">还有 365 天</div>
    <p class="letter">
      如果现在的你正在加班、迷茫、觉得一切都很慢，请记住，你曾经在某个普通的夜晚，认真地为未来留下了一句话。<br><br>
      不要急着证明给所有人看。先把今天过完，再走一步。
    </p>
    <p class="sig">今天的你</p>
  </main>
</body>
</html>
